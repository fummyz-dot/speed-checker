<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">通信中の応答時間の増加量</title>
  <desc id="desc">横軸は測定番号1〜14、縦軸はeffective increase（ms）。max(0, loaded latency - idle Ping)で計算。Downloadの最大は測定10の89.2 ms、Uploadの最大は測定4の68.1 ms。20 msはNet Speed Race独自の良好と注意の境界。</desc>
